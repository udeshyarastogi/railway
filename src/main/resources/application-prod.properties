# Railway production profile.
# Values without safe production defaults are intentionally required through environment variables.

server.port=${PORT}
mosip.api.public.url=${APP_PUBLIC_URL}
mosipbox.public.url=${APP_PUBLIC_URL}
openapi.service.servers[0].url=${APP_PUBLIC_URL}${server.servlet.context-path}

# Database configuration. Railway's PostgreSQL plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, and PGPASSWORD.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
keymanager_database_url=${KEYMANAGER_DATABASE_URL:${spring.datasource.url}}
keymanager_database_username=${KEYMANAGER_DATABASE_USERNAME:${spring.datasource.username}}
keymanager_database_password=${KEYMANAGER_DATABASE_PASSWORD:${spring.datasource.password}}

# Redis is recommended for production sessions and cache. Add Railway Redis and map these variables.
spring.session.store-type=${SESSION_STORE_TYPE:redis}
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Public web/OAuth settings.
mosip.inji.web.url=${INJI_WEB_URL}
mosip.inji.web.redirect.url=${mosip.inji.web.url}/authorize
mosip.security.origins=${CORS_ALLOWED_ORIGINS:${mosip.inji.web.url}}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Secrets and key material.
mosip.event.secret=${MOSIP_EVENT_SECRET}
mosip.partner.crypto.p12.password=${MOSIP_PARTNER_P12_PASSWORD}
mosip.partner.encryption.key=${MOSIP_PARTNER_ENCRYPTION_KEY}
token.request.password=${TOKEN_REQUEST_PASSWORD}
token.request.secretKey=${TOKEN_REQUEST_SECRET_KEY}
mosip.iam.adapter.clientsecret=${MOSIP_IAM_CLIENT_SECRET}
wallet.binding.partner.api.key=${WALLET_BINDING_PARTNER_API_KEY}
mosip.oidc.p12.password=${OIDC_P12_PASSWORD}
mosip.oidc.p12.filename=${OIDC_P12_FILENAME:oidckeystore.p12}
mosip.oidc.p12.path=${OIDC_P12_PATH:/tmp/}
mosip.kernel.keymanager.hsm.config-path=${KEYMANAGER_KEYSTORE_PATH:/tmp/oidckeystore.p12}
mosip.kernel.keymanager.hsm.keystore-pass=${KEYMANAGER_KEYSTORE_PASSWORD:${OIDC_P12_PASSWORD}}
safetynet.api.key=${SAFETYNET_API_KEY:}

# External service URLs. Keep these explicit in Railway so production does not depend on localhost.
keycloak.internal.url=${KEYCLOAK_INTERNAL_URL}
keycloak.external.url=${KEYCLOAK_EXTERNAL_URL}
mosip.kernel.masterdata.url=${MOSIP_MASTERDATA_URL}
mosip.kernel.authmanager.url=${MOSIP_AUTHMANAGER_URL}
mosip.resident.base.url=${MOSIP_RESIDENT_BASE_URL}
mosip.esignet.host=${MOSIP_ESIGNET_HOST}
mosip.websub.url=${MOSIP_WEBSUB_URL}
mosip.data.share.url=${MOSIP_DATA_SHARE_URL}
mosip.data.share.create.url=${mosip.data.share.url}/v1/datashare/create/static-policyid/static-subscriberid
mosip.data.share.get.url.pattern=${mosip.data.share.url}/v1/datashare/get/static-policyid/static-subscriberid/*

# OpenID4VP QR and redirect URLs must use the deployed HTTPS domain on Railway.
mosip.inji.ovp.qrdata.pattern=INJI_OVP://${APP_PUBLIC_URL}${server.servlet.context-path}/authorize?response_type=vp_token&resource=%s&presentation_definition=%s
mosip.inji.ovp.redirect.url.pattern=%s#vp_token=%s&presentation_submission=%s
mosip.inji.ovp.error.redirect.url.pattern=%s?error=%s&error_description=%s

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.io.mosip=${LOG_LEVEL_MOSIP:INFO}
logging.level.io.mosip.mimoto=${LOG_LEVEL_MIMOTO:INFO}
