# Railway production profile.
# Environment variables override these boot-safe defaults.

server.port=${PORT:8099}
server.address=${SERVER_ADDRESS:0.0.0.0}
mosip.api.public.url=${APP_PUBLIC_URL:http://localhost:${server.port}}
mosipbox.public.url=${APP_PUBLIC_URL:http://localhost:${server.port}}
openapi.service.servers[0].url=${APP_PUBLIC_URL:http://localhost:${server.port}}${server.servlet.context-path}

# Database configuration. Railway's PostgreSQL plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, and PGPASSWORD.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:inji_mimoto}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
keymanager_database_url=${KEYMANAGER_DATABASE_URL:${spring.datasource.url}}
keymanager_database_username=${KEYMANAGER_DATABASE_USERNAME:${spring.datasource.username}}
keymanager_database_password=${KEYMANAGER_DATABASE_PASSWORD:${spring.datasource.password}}

# Redis is recommended for scaled production. Defaults use in-memory cache/session so the app can boot before Redis is attached.
spring.session.store-type=${SESSION_STORE_TYPE:caffeine}
spring.cache.type=${CACHE_TYPE:caffeine}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Public web/OAuth settings.
mosip.inji.web.url=${INJI_WEB_URL:${APP_PUBLIC_URL:http://localhost:${server.port}}}
mosip.inji.web.redirect.url=${mosip.inji.web.url}/authorize
mosip.security.origins=${CORS_ALLOWED_ORIGINS:${mosip.inji.web.url}}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:replace-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:replace-me}

# Secrets and key material.
mosip.event.hubUrl=${MOSIP_EVENT_HUB_URL:${mosip.websub.url}/hub/}
mosip.event.hub.subUrl=${MOSIP_EVENT_HUB_SUB_URL:${mosip.event.hubUrl}}
mosip.event.hub.pubUrl=${MOSIP_EVENT_HUB_PUB_URL:${mosip.event.hubUrl}}
mosip.event.delay-millisecs=${MOSIP_EVENT_DELAY_MILLISECONDS:5000}
websub-resubscription-delay-millisecs=${WEBSUB_RESUBSCRIPTION_DELAY_MILLISECONDS:300000}
mosip.event.callBackUrl=${MOSIP_EVENT_CALLBACK_URL:${mosip.api.public.url}/v1/mimoto/credentialshare/callback/notify}
mosip.event.topic=${MOSIP_EVENT_TOPIC:${mosip.partner.id}/CREDENTIAL_ISSUED}
mosip.event.secret=${MOSIP_EVENT_SECRET:replace-me}
mosip.partner.id=${MOSIP_PARTNER_ID:mpartner-default-mobile}
mosip.partner.crypto.p12.filename=${MOSIP_PARTNER_P12_FILENAME:oidckeystore.p12}
mosip.partner.crypto.p12.password=${MOSIP_PARTNER_P12_PASSWORD:replace-me}
mosip.partner.crypto.p12.alias=${MOSIP_PARTNER_P12_ALIAS:partner}
mosip.partner.encryption.key=${MOSIP_PARTNER_ENCRYPTION_KEY:replace-me}
mosip.partner.prependThumbprint=${MOSIP_PARTNER_PREPEND_THUMBPRINT:true}
token.request.id=${TOKEN_REQUEST_ID:io.mosip.registration.processor}
token.request.appid=${TOKEN_REQUEST_APP_ID:regproc}
token.request.username=${TOKEN_REQUEST_USERNAME:registrationprocessor}
token.request.password=${TOKEN_REQUEST_PASSWORD:replace-me}
token.request.version=${TOKEN_REQUEST_VERSION:1.0}
token.request.clientId=${TOKEN_REQUEST_CLIENT_ID:mosip-regproc-client}
token.request.secretKey=${TOKEN_REQUEST_SECRET_KEY:replace-me}
token.request.issuerUrl=${TOKEN_REQUEST_ISSUER_URL:${keycloak.internal.url}/auth/realms/mosip}
mosip.iam.adapter.appid=${MOSIP_IAM_APP_ID:partner}
mosip.iam.adapter.clientid=${MOSIP_IAM_CLIENT_ID:mpartner-default-mobile}
mosip.iam.adapter.clientsecret=${MOSIP_IAM_CLIENT_SECRET:replace-me}
mosip.iam.adapter.issuerURL=${KEYCLOAK_INTERNAL_URL:http://keycloak.keycloak}/auth/realms/mosip
mosip.iam.adapter.validate-expiry-check-rate=${MOSIP_IAM_VALIDATE_EXPIRY_CHECK_RATE:1440}
mosip.iam.adapter.renewal-before-expiry-interval=${MOSIP_IAM_RENEWAL_BEFORE_EXPIRY_INTERVAL:1440}
mosip.iam.adapter.self-token-renewal-enable=${MOSIP_IAM_SELF_TOKEN_RENEWAL_ENABLE:true}
mosip.iam.adapter.disable-self-token-rest-template=${MOSIP_IAM_DISABLE_SELF_TOKEN_REST_TEMPLATE:true}
mosip.auth.filter_disable=${MOSIP_AUTH_FILTER_DISABLE:false}
mosip.auth.adapter.impl.basepackage=${MOSIP_AUTH_ADAPTER_BASE_PACKAGE:io.mosip.kernel.auth.defaultadapter}
mosip.kernel.auth.appids.realm.map=${MOSIP_AUTH_APPIDS_REALM_MAP:{prereg:'mosip',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip',crereq:'mosip',creser:'mosip',datsha:'mosip',idrepo:'mosip'}}
mosip.authmanager.base-url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}/v1/authmanager
mosip.authmanager.client-token-endpoint=${mosip.authmanager.base-url}/authenticate/clientidsecretkey
auth.server.admin.issuer.uri=${KEYCLOAK_EXTERNAL_URL:https://iam.collab.mosip.net}/auth/realms/
auth.server.admin.validate.url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}/v1/authmanager/authorize/admin/validateToken
wallet.binding.partner.id=${WALLET_BINDING_PARTNER_ID:mpartner-default-keybindingtoken}
wallet.binding.partner.api.key=${WALLET_BINDING_PARTNER_API_KEY:replace-me}
mosip.oidc.p12.password=${OIDC_P12_PASSWORD:replace-me}
mosip.oidc.p12.filename=${OIDC_P12_FILENAME:oidckeystore.p12}
mosip.oidc.p12.path=${OIDC_P12_PATH:/tmp/}
mosip.kernel.keymanager.hsm.config-path=${KEYMANAGER_KEYSTORE_PATH:/tmp/oidckeystore.p12}
mosip.kernel.keymanager.hsm.keystore-pass=${KEYMANAGER_KEYSTORE_PASSWORD:${mosip.oidc.p12.password}}
safetynet.api.key=${SAFETYNET_API_KEY:}

# MOSIP/OpenID supporting configuration.
AUDIT=${MOSIP_AUDIT_URL:${mosip.kernel.authmanager.url}/v1/auditmanager/audits}
AUDIT_URL=${MOSIP_AUDIT_URL:${mosip.kernel.authmanager.url}/v1/auditmanager/audits}
KEYBASEDTOKENAPI=${KEYBASEDTOKENAPI_URL:${mosip.kernel.authmanager.url}/v1/authmanager/authenticate/clientidsecretkey}
MASTER=${MASTERDATA_API_URL:${mosip.kernel.masterdata.url}/v1/masterdata}
TEMPLATES=${TEMPLATES_API_URL:${MASTER}/templates}
mosip.print.application.version=${MOSIP_PRINT_APPLICATION_VERSION:1.0}
mosip.print.datetime.pattern=${MOSIP_PRINT_DATETIME_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}
mosip.print.service.id=${MOSIP_PRINT_SERVICE_ID:mosip.print}
mosip.print.audit.id=${MOSIP_PRINT_AUDIT_ID:mosip.applicanttype.getApplicantType}
mosip.country.code=${MOSIP_COUNTRY_CODE:MOR}
registration.processor.signature.isEnabled=${REGISTRATION_PROCESSOR_SIGNATURE_ENABLED:true}
registration.processor.unMaskedUin.length=${REGISTRATION_PROCESSOR_UNMASKED_UIN_LENGTH:5}
IDSchema.Version=${ID_SCHEMA_VERSION:1.0}
registration.processor.identityjson=${REGISTRATION_PROCESSOR_IDENTITY_JSON:identity-mapping.json}
registration.processor.demographic.identity=${REGISTRATION_PROCESSOR_DEMOGRAPHIC_IDENTITY:identity}
CREATEDATASHARE=${CREATE_DATA_SHARE_URL:${mosipbox.public.url}/v1/datashare/create}
DECRYPTPINBASSED=${DECRYPT_PIN_BASED_URL:${mosipbox.public.url}/v1/keymanager/decryptWithPin}
mosip.kernel.xsdstorage-uri=${MOSIP_KERNEL_XSD_STORAGE_URI:https://raw.githubusercontent.com/mosip/mosip-config/qa-1201-B2/}
mosip.kernel.xsdfile=${MOSIP_KERNEL_XSD_FILE:mosip-cbeff.xsd}
mosip.kernel.pin.length=${MOSIP_KERNEL_PIN_LENGTH:6}
mosip.kernel.tokenid.length=${MOSIP_KERNEL_TOKEN_ID_LENGTH:36}
mosip.openid.issuers=${MOSIP_OPENID_ISSUERS:mimoto-issuers-config.json}
mosip.openid.verifiers=${MOSIP_OPENID_VERIFIERS:mimoto-trusted-verifiers.json}
mosip.openid.htmlTemplate=${MOSIP_OPENID_HTML_TEMPLATE:credential-template.html}
mosip.oidc.client.assertion.type=${OIDC_CLIENT_ASSERTION_TYPE:urn:ietf:params:oauth:client-assertion-type:jwt-bearer}

# External service URLs. Keep these explicit in Railway so production does not depend on localhost.
keycloak.internal.url=${KEYCLOAK_INTERNAL_URL:http://keycloak.keycloak}
keycloak.external.url=${KEYCLOAK_EXTERNAL_URL:https://iam.collab.mosip.net}
mosip.kernel.masterdata.url=${MOSIP_MASTERDATA_URL:http://masterdata.kernel}
mosip.kernel.authmanager.url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}
mosip.resident.base.url=${MOSIP_RESIDENT_BASE_URL:https://api.collab.mosip.net/resident/v1}
mosip.esignet.host=${MOSIP_ESIGNET_HOST:https://esignet.collab.mosip.net}
mosip.websub.url=${MOSIP_WEBSUB_URL:http://websub.websub}
mosip.data.share.url=${MOSIP_DATA_SHARE_URL:http://localhost:8097}
mosip.data.share.create.url=${mosip.data.share.url}/v1/datashare/create/static-policyid/static-subscriberid
mosip.data.share.get.url.pattern=${mosip.data.share.url}/v1/datashare/get/static-policyid/static-subscriberid/*
mosip.data.share.create.retry.count=${MOSIP_DATA_SHARE_CREATE_RETRY_COUNT:3}

# OpenID4VP QR and redirect URLs must use the deployed HTTPS domain on Railway.
mosip.inji.ovp.qrdata.pattern=INJI_OVP://${APP_PUBLIC_URL:http://localhost:${server.port}}${server.servlet.context-path}/authorize?response_type=vp_token&resource=%s&presentation_definition=%s
mosip.inji.ovp.redirect.url.pattern=%s#vp_token=%s&presentation_submission=%s
mosip.inji.ovp.error.redirect.url.pattern=%s?error=%s&error_description=%s

logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.io.mosip=${LOG_LEVEL_MOSIP:INFO}
logging.level.io.mosip.mimoto=${LOG_LEVEL_MIMOTO:INFO}
