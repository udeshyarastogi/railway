# Railway production profile.
# Environment variables override these boot-safe defaults.

server.port=${PORT:8099}
server.address=${SERVER_ADDRESS:0.0.0.0}
mosip.api.public.url=${APP_PUBLIC_URL:http://localhost:${server.port}}
mosipbox.public.url=${APP_PUBLIC_URL:http://localhost:${server.port}}
openapi.service.servers[0].url=${APP_PUBLIC_URL:http://localhost:${server.port}}${server.servlet.context-path}

# -----------------------------------------------------------------------
# Database configuration.
# Railway's PostgreSQL plugin exposes PGHOST, PGPORT, PGDATABASE, PGUSER, and PGPASSWORD.
# -----------------------------------------------------------------------
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:inji_mimoto}}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
keymanager_database_url=${KEYMANAGER_DATABASE_URL:${spring.datasource.url}}
keymanager_database_username=${KEYMANAGER_DATABASE_USERNAME:${spring.datasource.username}}
keymanager_database_password=${KEYMANAGER_DATABASE_PASSWORD:${spring.datasource.password}}
keymanager.persistence.jdbc.driver=org.postgresql.Driver
keymanager.persistence.jdbc.schema=mimoto

# Hibernate properties required by the keymanager JPA layer.
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.hbm2ddl.auto=none
hibernate.jdbc.lob.non_contextual_creation=true
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.connection.charSet=utf8
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false
hibernate.cache.use_structured_entries=false
hibernate.generate_statistics=false
hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext

# -----------------------------------------------------------------------
# Session and cache.
# Defaults to Caffeine (in-process) so the app boots without Redis.
# Set SESSION_STORE_TYPE=redis and CACHE_TYPE=redis once Redis is attached.
# -----------------------------------------------------------------------
spring.session.store-type=${SESSION_STORE_TYPE:caffeine}
spring.cache.type=${CACHE_TYPE:caffeine}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s
server.servlet.session.timeout=30m
spring.session.redis.namespace=injiweb:session:

# Cache TTLs (minutes).
cache.credential-issuer.wellknown.expiry-time-in-min=60
cache.issuers-config.expiry-time-in-min=60
cache.credential-issuer.authserver-wellknown.expiry-time-in-min=60
cache.pre-registered-trusted-verifiers.expiry-time-in-min=60
cache.default.expiry-time-in-min=60

# -----------------------------------------------------------------------
# Security / CORS / OAuth2.
# -----------------------------------------------------------------------
mosip.security.cors-enable=${CORS_ENABLE:true}
mosip.security.origins=${CORS_ALLOWED_ORIGINS:${mosip.inji.web.url}}
mosip.security.ignore-auth-urls=/safetynet/**,/actuator/**,/swagger-ui/**,/v3/api-docs/**,\
  /allProperties,/credentials/**,/credentialshare/**,/binding-otp,/wallet-binding,/get-token/**,\
  /issuers,/issuers/**,/v2/issuers,/v2/issuers/**,/authorize,/req/otp,/vid,/req/auth/**,/req/individualId/otp,/aid/get-individual-id,\
 /verifiers, /auth/*/token-login
mosip.security.csrf-ignore-urls=/oauth2/**,/logout,/safetynet/**,/credentials/**,/credentialshare/**,/binding-otp,/wallet-binding,\
  /get-token/**,/req/otp,/vid,/req/auth/**,/req/individualId/otp,/auth/*/token-login

# Google OAuth2. Set GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET to enable login.
# When credentials are absent the app still starts; OAuth2 login will be non-functional.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-set-GOOGLE_CLIENT_ID-to-enable}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-set-GOOGLE_CLIENT_SECRET-to-enable}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/oauth2/callback/{registrationId}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth?prompt=select_account
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.userNameAttribute=sub
spring.security.oauth2.client.provider.google.nameAttribute=name
spring.security.oauth2.client.provider.google.emailAttribute=email
spring.security.oauth2.client.provider.google.pictureAttribute=picture
spring.security.oauth2.client.provider.google.phoneNumberAttribute=phone_number

# -----------------------------------------------------------------------
# Inji mobile-wallet properties.
# -----------------------------------------------------------------------
mosip.inji.allowedAuthType=demo,otp,bio-Finger,bio-Iris,bio-Face
mosip.inji.allowedEkycAuthType=demo,otp,bio-Finger,bio-Iris,bio-Face
mosip.inji.allowedInternalAuthType=otp,bio-Finger,bio-Iris,bio-Face
mosip.inji.faceSdkModelUrl=${MOSIP_FACE_SDK_MODEL_URL:https://api.collab.mosip.net/inji}
mosip.inji.vcDownloadMaxRetry=10
mosip.inji.vcDownloadPoolInterval=6000
mosip.inji.audience=ida-binding
mosip.inji.issuer=residentapp
mosip.inji.warningDomainName=${mosip.api.public.url}
mosip.inji.openId4VCIDownloadVCTimeout=30000
mosip.inji.aboutInjiUrl=https://docs.inji.io/inji-wallet/inji-mobile
mosip.inji.minStorageRequiredForAuditEntry=2
mosip.inji.minStorageRequired=2
mosip.inji.app.id=MIMOTO

# -----------------------------------------------------------------------
# Inji Web settings.
# -----------------------------------------------------------------------
mosip.inji.web.url=${INJI_WEB_URL:${APP_PUBLIC_URL:http://localhost:${server.port}}}
mosip.inji.web.redirect.url=${mosip.inji.web.url}/authorize
mosip.inji.web.authentication.success.redirect.url=${mosip.inji.web.url}/user/passcode
mosip.inji.wallet.issuersWithSingleVcLimit=Mosip
mosip.inji.qr.data.size.limit=4096
mosip.inji.qr.code.height=400
mosip.inji.qr.code.width=400
mosip.inji.user.wallet.pin.validation.regex=^\\d{6}$
mosip.inji.user.wallet.name.validation.regex=^[A-Za-z0-9 _.-]{0,50}$
mosip.injiweb.vc.subject.face.keys.order=image,face,photo,picture,portrait
mosip.injiweb.mask.disclosures=true

# -----------------------------------------------------------------------
# Wallet passcode lockout settings.
# -----------------------------------------------------------------------
wallet.passcode.retryBlockedUntil=60
wallet.passcode.maxFailedAttemptsAllowedPerCycle=5
wallet.passcode.maxLockCyclesAllowed=3

# -----------------------------------------------------------------------
# Credential / template / safety-net.
# -----------------------------------------------------------------------
credential.template=template.json
credential.data.path=data
safetynet.api.key=${SAFETYNET_API_KEY:}
safetynet.api.url=https://www.googleapis.com/androidcheck/v1/attestations/verify?key=${safetynet.api.key}
registration.processor.print.textfile=registration-processor-print-text-file.json

# -----------------------------------------------------------------------
# Signing algorithms.
# -----------------------------------------------------------------------
signing.algorithms.priority.order=ED25519,ES256K,ES256,RS256

# -----------------------------------------------------------------------
# Key-manager / OIDC keystore.
# The keystore at KEYMANAGER_KEYSTORE_PATH is created automatically on first
# boot by the KeyManager service if it does not already exist.
# KEYMANAGER_KEYSTORE_PASSWORD must be set to a stable secret in Railway so
# the same keystore can be re-opened across restarts.
# -----------------------------------------------------------------------
mosip.oidc.p12.filename=${OIDC_P12_FILENAME:oidckeystore.p12}
mosip.oidc.p12.password=${OIDC_P12_PASSWORD:mimoto-default-keystore-password}
mosip.oidc.p12.path=${OIDC_P12_PATH:/tmp/}
mosip.kernel.keymanager.hsm.config-path=${KEYMANAGER_KEYSTORE_PATH:/tmp/oidckeystore.p12}
mosip.kernel.keymanager.hsm.keystore-type=PKCS12
mosip.kernel.keymanager.hsm.keystore-pass=${KEYMANAGER_KEYSTORE_PASSWORD:${mosip.oidc.p12.password}}

# Keymanager certificate defaults.
mosip.kernel.keymanager.certificate.default.common-name=www.example.com
mosip.kernel.keymanager.certificate.default.organizational-unit=EXAMPLE-CENTER
mosip.kernel.keymanager.certificate.default.organization=IIITB
mosip.kernel.keymanager.certificate.default.location=BANGALORE
mosip.kernel.keymanager.certificate.default.state=KA
mosip.kernel.keymanager.certificate.default.country=IN

# Crypto algorithm settings required by the keymanager.
mosip.kernel.crypto.asymmetric-algorithm-name=RSA/ECB/OAEPWITHSHA-256ANDMGF1PADDING
mosip.kernel.crypto.symmetric-algorithm-name=AES/GCM/NoPadding
mosip.kernel.data-key-splitter=#KEY_SPLITTER#
mosip.kernel.crypto.gcm-tag-length=128
mosip.kernel.crypto.hash-algorithm-name=PBKDF2WithHmacSHA512
mosip.kernel.crypto.hash-symmetric-key-length=256
mosip.kernel.crypto.hash-iteration=10000
mosip.kernel.keygenerator.symmetric-algorithm-name=AES
mosip.kernel.keygenerator.symmetric-key-length=256
mosip.kernel.keygenerator.asymmetric-key-length=2048
mosip.kernel.keygenerator.asymmetric-algorithm-name=RSA
mosip.kernel.pin.length=${MOSIP_KERNEL_PIN_LENGTH:6}
mosip.kernel.tokenid.length=${MOSIP_KERNEL_TOKEN_ID_LENGTH:36}
mosip.kernel.xsdstorage-uri=${MOSIP_KERNEL_XSD_STORAGE_URI:https://raw.githubusercontent.com/mosip/mosip-config/qa-1201-B2/}
mosip.kernel.xsdfile=${MOSIP_KERNEL_XSD_FILE:mosip-cbeff.xsd}

# -----------------------------------------------------------------------
# MOSIP partner / WebSub / event settings.
# These are only needed for the MOSIP OTP issuer flow. The app starts
# without a live WebSub hub — subscription errors are logged and retried.
# -----------------------------------------------------------------------
mosip.partner.id=${MOSIP_PARTNER_ID:mpartner-default-mobile}
mosip.partner.crypto.p12.filename=${MOSIP_PARTNER_P12_FILENAME:oidckeystore.p12}
mosip.partner.crypto.p12.password=${MOSIP_PARTNER_P12_PASSWORD:mimoto-default-keystore-password}
mosip.partner.crypto.p12.alias=${MOSIP_PARTNER_P12_ALIAS:partner}
mosip.partner.encryption.key=${MOSIP_PARTNER_ENCRYPTION_KEY:mosip-default-encryption-key}
mosip.partner.prependThumbprint=${MOSIP_PARTNER_PREPEND_THUMBPRINT:true}
mosip.event.hubUrl=${MOSIP_EVENT_HUB_URL:${mosip.websub.url}/hub/}
mosip.event.hub.subUrl=${MOSIP_EVENT_HUB_SUB_URL:${mosip.event.hubUrl}}
mosip.event.hub.pubUrl=${MOSIP_EVENT_HUB_PUB_URL:${mosip.event.hubUrl}}
mosip.event.delay-millisecs=${MOSIP_EVENT_DELAY_MILLISECONDS:5000}
websub-resubscription-delay-millisecs=${WEBSUB_RESUBSCRIPTION_DELAY_MILLISECONDS:300000}
mosip.event.callBackUrl=${MOSIP_EVENT_CALLBACK_URL:${mosip.api.public.url}/v1/mimoto/credentialshare/callback/notify}
mosip.event.topic=${MOSIP_EVENT_TOPIC:${mosip.partner.id}/CREDENTIAL_ISSUED}
mosip.event.secret=${MOSIP_EVENT_SECRET:mosip-default-websub-secret}
mosip.notificationtype=SMS|EMAIL|PHONE

# -----------------------------------------------------------------------
# IAM / auth adapter.
# mosip.auth.filter_disable=true prevents the MOSIP auth adapter from
# blocking requests when Keycloak is not reachable.
# -----------------------------------------------------------------------
mosip.iam.adapter.appid=${MOSIP_IAM_APP_ID:partner}
mosip.iam.adapter.clientid=${MOSIP_IAM_CLIENT_ID:mpartner-default-mobile}
mosip.iam.adapter.clientsecret=${MOSIP_IAM_CLIENT_SECRET:mosip-default-client-secret}
mosip.iam.adapter.issuerURL=${KEYCLOAK_INTERNAL_URL:http://keycloak.keycloak}/auth/realms/mosip
mosip.iam.adapter.validate-expiry-check-rate=${MOSIP_IAM_VALIDATE_EXPIRY_CHECK_RATE:1440}
mosip.iam.adapter.renewal-before-expiry-interval=${MOSIP_IAM_RENEWAL_BEFORE_EXPIRY_INTERVAL:1440}
mosip.iam.adapter.self-token-renewal-enable=${MOSIP_IAM_SELF_TOKEN_RENEWAL_ENABLE:false}
mosip.iam.adapter.disable-self-token-rest-template=${MOSIP_IAM_DISABLE_SELF_TOKEN_REST_TEMPLATE:true}
# Disable the MOSIP auth filter so the app serves requests without Keycloak.
# Set MOSIP_AUTH_FILTER_DISABLE=false once a Keycloak instance is available.
mosip.auth.filter_disable=${MOSIP_AUTH_FILTER_DISABLE:true}
mosip.auth.adapter.impl.basepackage=${MOSIP_AUTH_ADAPTER_BASE_PACKAGE:io.mosip.kernel.auth.defaultadapter}
mosip.kernel.auth.appids.realm.map=${MOSIP_AUTH_APPIDS_REALM_MAP:{prereg:'mosip',ida:'mosip',registrationclient:'mosip',regproc:'mosip',partner:'mosip',resident:'mosip',admin:'mosip',crereq:'mosip',creser:'mosip',datsha:'mosip',idrepo:'mosip'}}
mosip.authmanager.base-url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}/v1/authmanager
mosip.authmanager.client-token-endpoint=${mosip.authmanager.base-url}/authenticate/clientidsecretkey
auth.server.admin.issuer.uri=${KEYCLOAK_EXTERNAL_URL:https://iam.collab.mosip.net}/auth/realms/
auth.server.admin.validate.url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}/v1/authmanager/authorize/admin/validateToken

# Token generation (used by the MOSIP auth adapter).
token.request.id=${TOKEN_REQUEST_ID:io.mosip.registration.processor}
token.request.appid=${TOKEN_REQUEST_APP_ID:regproc}
token.request.username=${TOKEN_REQUEST_USERNAME:registrationprocessor}
token.request.password=${TOKEN_REQUEST_PASSWORD:mosip-default-token-password}
token.request.version=${TOKEN_REQUEST_VERSION:1.0}
token.request.clientId=${TOKEN_REQUEST_CLIENT_ID:mosip-regproc-client}
token.request.secretKey=${TOKEN_REQUEST_SECRET_KEY:mosip-default-secret-key}
token.request.issuerUrl=${TOKEN_REQUEST_ISSUER_URL:${keycloak.internal.url}/auth/realms/mosip}

# -----------------------------------------------------------------------
# Wallet binding.
# -----------------------------------------------------------------------
wallet.binding.partner.id=${WALLET_BINDING_PARTNER_ID:mpartner-default-keybindingtoken}
wallet.binding.partner.api.key=${WALLET_BINDING_PARTNER_API_KEY:mosip-default-wallet-binding-key}

# -----------------------------------------------------------------------
# External MOSIP service URLs.
# These point to placeholder hosts by default; the app starts without them
# but MOSIP OTP issuer flows will fail until real URLs are configured.
# -----------------------------------------------------------------------
keycloak.internal.url=${KEYCLOAK_INTERNAL_URL:http://keycloak.keycloak}
keycloak.external.url=${KEYCLOAK_EXTERNAL_URL:https://iam.collab.mosip.net}
mosip.kernel.masterdata.url=${MOSIP_MASTERDATA_URL:http://masterdata.kernel}
mosip.kernel.authmanager.url=${MOSIP_AUTHMANAGER_URL:http://authmanager.kernel}
mosip.resident.base.url=${MOSIP_RESIDENT_BASE_URL:https://api.collab.mosip.net/resident/v1}
mosip.esignet.host=${MOSIP_ESIGNET_HOST:https://esignet.collab.mosip.net}
mosip.websub.url=${MOSIP_WEBSUB_URL:http://websub.websub}
mosip.data.share.url=${MOSIP_DATA_SHARE_URL:http://localhost:8097}
mosip.data.share.create.url=${mosip.data.share.url}/v1/datashare/create/static-policyid/static-subscriberid
mosip.data.share.get.url.pattern=${mosip.data.share.url}/v1/datashare/get/static-policyid/static-subscriberid/*
mosip.data.share.create.retry.count=${MOSIP_DATA_SHARE_CREATE_RETRY_COUNT:3}

# Resident service endpoints.
RESIDENT_OTP=${mosip.resident.base.url}/req/otp
RESIDENT_INDIVIDUALID_OTP=${mosip.resident.base.url}/individualId/otp
RESIDENT_AID_GET_INDIVIDUALID=${mosip.resident.base.url}/aid/status
RESIDENT_CREDENTIAL_REQUEST=${mosip.resident.base.url}/req/credential
RESIDENT_CREDENTIAL_REQUEST_STATUS=${RESIDENT_CREDENTIAL_REQUEST}/status
RESIDENT_VID=${mosip.resident.base.url}/vid
RESIDENT_AUTH_LOCK=${mosip.resident.base.url}/req/auth-lock
RESIDENT_AUTH_UNLOCK=${mosip.resident.base.url}/req/auth-unlock

# eSignet endpoints.
BINDING_OTP=${mosip.esignet.host}/v1/esignet/binding/binding-otp
WALLET_BINDING=${mosip.esignet.host}/v1/esignet/binding/wallet-binding

# -----------------------------------------------------------------------
# MOSIP/OpenID supporting configuration.
# -----------------------------------------------------------------------
AUDIT=${MOSIP_AUDIT_URL:${mosip.kernel.authmanager.url}/v1/auditmanager/audits}
AUDIT_URL=${MOSIP_AUDIT_URL:${mosip.kernel.authmanager.url}/v1/auditmanager/audits}
KEYBASEDTOKENAPI=${KEYBASEDTOKENAPI_URL:${mosip.kernel.authmanager.url}/v1/authmanager/authenticate/clientidsecretkey}
MASTER=${MASTERDATA_API_URL:${mosip.kernel.masterdata.url}/v1/masterdata}
TEMPLATES=${TEMPLATES_API_URL:${MASTER}/templates}
CREATEDATASHARE=${CREATE_DATA_SHARE_URL:${mosipbox.public.url}/v1/datashare/create}
DECRYPTPINBASSED=${DECRYPT_PIN_BASED_URL:${mosipbox.public.url}/v1/keymanager/decryptWithPin}
mosip.print.application.version=${MOSIP_PRINT_APPLICATION_VERSION:1.0}
mosip.print.datetime.pattern=${MOSIP_PRINT_DATETIME_PATTERN:yyyy-MM-dd'T'HH:mm:ss.SSS'Z'}
mosip.print.service.id=${MOSIP_PRINT_SERVICE_ID:mosip.print}
mosip.print.audit.id=${MOSIP_PRINT_AUDIT_ID:mosip.applicanttype.getApplicantType}
mosip.country.code=${MOSIP_COUNTRY_CODE:MOR}
registration.processor.signature.isEnabled=${REGISTRATION_PROCESSOR_SIGNATURE_ENABLED:true}
registration.processor.unMaskedUin.length=${REGISTRATION_PROCESSOR_UNMASKED_UIN_LENGTH:5}
IDSchema.Version=${ID_SCHEMA_VERSION:1.0}
registration.processor.identityjson=${REGISTRATION_PROCESSOR_IDENTITY_JSON:identity-mapping.json}
registration.processor.demographic.identity=${REGISTRATION_PROCESSOR_DEMOGRAPHIC_IDENTITY:identity}
mosip.optional-languages=fra,ara
mosip.mandatory-languages=eng
mosip.kernel.applicant.type.age.limit=5
mosip.openid.issuers=${MOSIP_OPENID_ISSUERS:mimoto-issuers-config.json}
mosip.openid.verifiers=${MOSIP_OPENID_VERIFIERS:mimoto-trusted-verifiers.json}
mosip.openid.htmlTemplate=${MOSIP_OPENID_HTML_TEMPLATE:credential-template.html}
mosip.oidc.client.assertion.type=${OIDC_CLIENT_ASSERTION_TYPE:urn:ietf:params:oauth:client-assertion-type:jwt-bearer}

# -----------------------------------------------------------------------
# OpenID4VP QR and redirect URLs.
# -----------------------------------------------------------------------
mosip.inji.ovp.qrdata.pattern=INJI_OVP://${APP_PUBLIC_URL:http://localhost:${server.port}}${server.servlet.context-path}/authorize?response_type=vp_token&resource=%s&presentation_definition=%s
mosip.inji.ovp.redirect.url.pattern=%s#vp_token=%s&presentation_submission=%s
mosip.inji.ovp.error.redirect.url.pattern=%s?error=%s&error_description=%s

# -----------------------------------------------------------------------
# Logging.
# -----------------------------------------------------------------------
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.io.mosip=${LOG_LEVEL_MOSIP:INFO}
logging.level.io.mosip.mimoto=${LOG_LEVEL_MIMOTO:INFO}
